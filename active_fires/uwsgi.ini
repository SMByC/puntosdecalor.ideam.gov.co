[uwsgi]
plugins = python3
strict = true

# project layout
set-placeholder = site=active_fires
set-placeholder = base=/home/activefires/apps
chdir = %(base)/Active_Fires
module = %(site).wsgi:application
env = DJANGO_SETTINGS_MODULE=%(site).settings

# process model
master = true
processes = 4
threads = 4
enable-threads = true
lazy-apps = true
thunder-lock = true
single-interpreter = true
need-app = true

# socket
socket = /var/run/uwsgi/uwsgi.sock
chmod-socket = 660
vacuum = true

# request limits
buffer-size = 65535
# harakiri is the real ceiling on a request: it must match the uwsgi_read_timeout
# / uwsgi_send_timeout / uwsgi_connect_timeout repeated in
# active_fires_nginx.conf, or the smaller of the two wins silently. At 240 with
# nginx at 600, a full-country active_fires.json or a large /download-result/
# CSV was killed at 4 minutes and surfaced as a 502 while the nginx config read
# as if 10 minutes were allowed. Change both files together.
harakiri = 600
harakiri-verbose = true
socket-timeout = 600
post-buffering = 8192

# worker recycling (prevent memory leaks)
max-requests = 5000
reload-on-rss = 512

# shutdown behavior
die-on-term = true

# logging
# No `logto` on purpose: stdout/stderr go to the journal through uwsgi.service
# (StandardOutput=journal / StandardError=journal), which is what every other
# instruction in this repo points at — `journalctl -u uwsgi -f`, `make
# verify-uwsgi`. A file under /var/log is not writable by User=activefires, and
# with harakiri-verbose it would grow unbounded: nothing here installs a
# logrotate snippet. journald timestamps every line, so `log-date` is redundant.
