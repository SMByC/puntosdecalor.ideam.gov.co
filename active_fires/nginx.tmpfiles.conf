#
#  Template for /etc/tmpfiles.d/nginx.conf on the AlmaLinux 9 production host.
#
#  WHY THIS FILE EXISTS
#  --------------------
#  The EL9 nginx RPM ships /usr/lib/tmpfiles.d/nginx.conf:
#
#      d /var/lib/nginx     770 nginx root -
#      d /var/lib/nginx/tmp 770 nginx root -
#      d /var/log/nginx     711 root  root -
#
#  At every boot, systemd-tmpfiles-setup.service runs *before* nginx and
#  re-creates / re-owns those two directories back to nginx:root 0770
#  (type `d` corrects ownership/mode of existing dirs, not only missing ones).
#
#  This deployment runs nginx workers as `user activefires;`
#  (see /etc/nginx/nginx.conf, required header in active_fires_nginx.conf).
#  Large responses — year-long active_fires.json queries, big CSV downloads —
#  exceed uwsgi_buffers and spill to disk via uwsgi_temp_path
#  (/var/lib/nginx/tmp/uwsgi, the compiled-in default). Workers need
#  write/traverse through /var/lib/nginx and /var/lib/nginx/tmp. With the
#  packaged ownership (nginx:root 0770) and activefires NOT in group root,
#  every spill fails:
#
#      open() "/var/lib/nginx/tmp/uwsgi/0/01/0000000010" failed (13: Permission denied)
#
#  A manual `chown -R activefires.nginx /var/lib/nginx/` fixes it until the
#  next reboot, when tmpfiles resets it — the symptom you saw.
#
#  WHAT /etc/tmpfiles.d/ DOES
#  ---------------------------
#  Files in /etc/tmpfiles.d/ with the same name *replace* the packaged file
#  in /usr/lib/tmpfiles.d/ entirely (file-level precedence, not line merge).
#  Placing this file at /etc/tmpfiles.d/nginx.conf therefore overrides the
#  vendor file. Its `d` entries then correct ownership to activefires at every
#  boot, surviving `dnf update nginx` (RPM never touches /etc).
#
#  INSTALL (run ONCE on the AlmaLinux 9 host, as root)
#  -----------------------------------------------------
#    sudo cp active_fires/nginx.tmpfiles.conf /etc/tmpfiles.d/nginx.conf
#    sudo systemd-tmpfiles --create nginx.conf
#    ls -ld /var/lib/nginx /var/lib/nginx/tmp
#      # must now show: drwxrwx--- activefires root ... /var/lib/nginx
#      #                drwxrwx--- activefires root ... /var/lib/nginx/tmp
#    # no nginx reload needed, but harmless:
#    # sudo nginx -t && sudo systemctl reload nginx
#
#  VERIFY
#  ------
#    # trigger a large spill:
#    curl -s "https://puntosdecalor.ideam.gov.co/active_fires.json/?from_date=2025-01-01&to_date=2025-12-31&region=colombia" -o /dev/null
#    sudo tail -n 20 /var/log/nginx/error.log   # no open() ... (13:) lines
#    # after a reboot:
#    ls -ld /var/lib/nginx /var/lib/nginx/tmp   # still activefires
#
#  WHY NOT `usermod -aG nginx activefires`?
#  ----------------------------------------
#  On EL9 the packaged group is *root*, not *nginx* (nginx:root 0770), so
#  membership in the nginx group grants nothing on those dirs. Making it work
#  would require `chgrp nginx` *plus* `usermod`, and that chgrp is itself
#  reverted by the same `d` entry — you end up needing this override anyway,
#  with two coordinated changes instead of one. The owner override is explicit,
#  self-documenting, and has the narrowest privilege.
#
#  SELINUX
#  -------
#  Both ownership variants keep the existing label httpd_var_lib_t on
#  /var/lib/nginx(/.*)?, so SELinux continues to allow nginx (httpd_t) writes.
#  No semanage / chcon needed. `rpm -V nginx-core` will report the two dirs
#  as "drifted" (expected, cosmetic).
#
#  KEEP IN SYNC
#  ------------
#  If the vendor file gains entries (check after `dnf update nginx`):
#    cat /usr/lib/tmpfiles.d/nginx.conf
#  mirror them here, changing only the user field where the worker needs write.

# This deployment: workers run as activefires.
d /var/lib/nginx       770 activefires root -
d /var/lib/nginx/tmp   770 activefires root -
# uwsgi_cache_path in active_fires_nginx.conf. Not a vendor path: it is ours,
# and it is listed here for the same reason as the two above — the cache manager
# runs as the worker user, so a boot-time chown back to nginx:root would make
# every cache write fail exactly the way the spills did.
d /var/lib/nginx/cache 770 activefires root -
d /var/log/nginx       711 root  root -
