#
# Nginx configuration for Active Fires
#
# Install:
#   sudo cp active_fires/active_fires_nginx.conf /etc/nginx/conf.d/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Ensure /etc/nginx/nginx.conf has:
#   user activefires;
#

upstream django {
    server unix:/var/run/uwsgi/uwsgi.sock;
}

# redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name puntosdecalor.ideam.gov.co www.puntosdecalor.ideam.gov.co;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name puntosdecalor.ideam.gov.co *.puntosdecalor.ideam.gov.co;

    # --- SSL/TLS ---
    ssl_certificate     /etc/ssl/certs/wildcard_ideam_gov_co.crt;
    ssl_certificate_key /etc/ssl/private/wildcard_ideam_gov_co.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    charset utf-8;
    client_max_body_size 10M;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/geo+json image/svg+xml;

    # --- Static files ---
    location /static/ {
        alias /home/activefires/apps/Active_Fires/static_production/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- uWSGI proxy ---
    location / {
        include uwsgi_params;
        uwsgi_pass django;

        uwsgi_ignore_client_abort on;
        uwsgi_read_timeout    600;
        uwsgi_send_timeout    600;
        uwsgi_connect_timeout 600;
    }
}
