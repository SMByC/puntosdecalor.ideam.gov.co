[uwsgi]
plugins = python3
strict = true

# project layout
set-placeholder = site=active_fires
set-placeholder = base=/home/activefires/apps
chdir = %(base)/Active_Fires
module = %(site).wsgi:application
env = DJANGO_SETTINGS_MODULE=%(site).settings

# process model
master = true
processes = 4
threads = 4
enable-threads = true
lazy-apps = true
thunder-lock = true
single-interpreter = true
need-app = true

# socket
socket = /var/run/uwsgi/uwsgi.sock
chmod-socket = 660
vacuum = true

# request limits
buffer-size = 65535
harakiri = 240
harakiri-verbose = true
socket-timeout = 240
post-buffering = 8192

# worker recycling (prevent memory leaks)
max-requests = 5000
reload-on-rss = 512

# shutdown behavior
die-on-term = true

# logging
logto = /var/log/uwsgi/active_fires.log
log-date = true
