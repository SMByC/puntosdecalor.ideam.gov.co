#
# Nginx configuration for Active Fires
#
# Includes bot/abuse protection: per-IP rate limits (429) on expensive and
# login endpoints, connection caps, 404 for scanner-probed paths and a short
# deny map of attack-tool user agents. robots.txt / sitemap.xml / llms.txt
# (the polite part of the policy, served by Django) live in templates/.
#
# Install (nginx conf):
#   sudo cp active_fires/active_fires_nginx.conf /etc/nginx/conf.d/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Verify after reload: repeat `curl -s -o /dev/null -w '%{http_code}\n'`
# against https://puntosdecalor.ideam.gov.co/active_fires.json/ more than
# ~22 times in a burst -> responses turn into 429 (with Retry-After).
#
# This file is included inside the http {} block (e.g. include /etc/nginx/conf.d/*.conf;).
# Ensure /etc/nginx/nginx.conf has:
#   user activefires;
#
# ── AlmaLinux 9 tmpfiles (REQUIRED) ──
# EL9 re-owns /var/lib/nginx{,/tmp} to nginx:root at boot
# (systemd-tmpfiles, see /usr/lib/tmpfiles.d/nginx.conf). Workers run as
# activefires, so large uwsgi spills fail with 13: Permission denied and
# chown is lost on reboot. Fix: active_fires/nginx.tmpfiles.conf
# → /etc/tmpfiles.d/nginx.conf + systemd-tmpfiles --create (see that file).
#

upstream django {
    server unix:/var/run/uwsgi/uwsgi.sock;
}

# --- Bot / abuse protection --------------------------------------------------
# Rate-limit zones ("leaky bucket", keyed by client IP), enforced per location
# below; a client exceeding its bucket gets 429 before uWSGI wakes up.
#   af_general  normal browsing
#   af_heavy    expensive queries (country-wide ranges stream megabytes)
#   af_popup    marker popups (users click several points in quick succession)
#   af_login    Django admin login (credential-stuffing throttle)
limit_req_zone $binary_remote_addr zone=af_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=af_heavy:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=af_popup:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=af_login:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=af_conn:10m;

# --- Response cache for the hotspot query ------------------------------------
# Every visitor lands on the same default query (yesterday..today, colombia), so
# a group opening the map together asks uWSGI one expensive question many times.
# nginx.tmpfiles.conf owns the directory as activefires: the cache manager runs
# as the worker user, and EL9 re-owns anything under /var/lib/nginx at boot.
# `inactive` drops untouched entries even while max_size is far from reached.
uwsgi_cache_path /var/lib/nginx/cache levels=1:2 keys_zone=af_json:10m
                 max_size=256m inactive=10m use_temp_path=off;

# Known attack-tool user agents (SQL injection tools and vulnerability
# scanners). Deliberately short: the rate limits above catch everything else,
# and long UA lists rot.
map $http_user_agent $af_bad_bot {
    default      0;
    ~*sqlmap     1;
    ~*nikto      1;
    ~*nmap       1;
    ~*masscan    1;
    ~*zgrab      1;
    ~*acunetix   1;
    ~*netsparker 1;
    ~*dirbuster  1;
    ~*wpscan     1;
    ~*havij      1;
}

# Seconds to back off, sent only on rate-limit rejections (limit_req_status is
# PASSED/DELAYED/REJECTED); an empty value makes add_header omit the field,
# so normal answers carry no Retry-After at all.
map $limit_req_status $af_retry_after {
    default   '';
    REJECTED  10;
}

# Cache policy for the content-hashed assets. It lives in a map so that
# `location /static/` needs no add_header of its own: one add_header inside a
# location cancels inheritance of every server-level add_header, the security
# headers included. An empty value makes add_header omit the field, as with
# $af_retry_after above.
map $uri $af_cache_control {
    default    '';
    ~^/static/ 'public, max-age=604800, immutable';
}

# redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name puntosdecalor.ideam.gov.co www.puntosdecalor.ideam.gov.co;
    return 301 https://$server_name$request_uri;
}

# www -> apex redirect: canonical is https://puntosdecalor.ideam.gov.co/ (see base.html)
#
# Sibling server blocks inherit nothing from one another, so the TLS policy and
# the security headers are repeated from the apex block below. Without them this
# vhost negotiates on nginx's compiled-in defaults and answers with no HSTS,
# leaving a first visit to the www name unpinned.
# KEEP IN SYNC with the apex server block.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.puntosdecalor.ideam.gov.co;

    ssl_certificate     /etc/ssl/certs/wildcard_ideam_gov_co.crt;
    ssl_certificate_key /etc/ssl/private/wildcard_ideam_gov_co.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    return 301 https://puntosdecalor.ideam.gov.co$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name puntosdecalor.ideam.gov.co *.puntosdecalor.ideam.gov.co;

    # --- SSL/TLS ---
    ssl_certificate     /etc/ssl/certs/wildcard_ideam_gov_co.crt;
    ssl_certificate_key /etc/ssl/private/wildcard_ideam_gov_co.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    # OCSP stapling. ssl_stapling_verify validates the response up to a trusted
    # root, so ssl_trusted_certificate names a CA store, not the server
    # certificate, which carries no root; the intermediates come from the
    # certificate above, which must therefore be the full chain. A missing file
    # here is an [emerg], not a warning: nginx will not start. On EL9 the bundle
    # belongs to the ca-certificates package. Expect "successful" from:
    #   openssl s_client -connect puntosdecalor.ideam.gov.co:443 -status \
    #     </dev/null 2>/dev/null | grep -A1 'OCSP Response Status'
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;

    # --- Security headers ---
    # A location inherits these only while it declares no add_header of its own;
    # one directive there drops all of them, which is why the per-location cache
    # policy is a map. KEEP IN SYNC with the www server block.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Cache-Control $af_cache_control always;
    # HIT / MISS / EXPIRED / UPDATING on the cached endpoint; $upstream_cache_status
    # is empty elsewhere, so the header is omitted there
    add_header X-Cache-Status $upstream_cache_status always;

    charset utf-8;
    client_max_body_size 10M;

    # --- Bot / abuse protection ---
    # 40 concurrent connections per IP: generous for offices behind a NAT
    # (a browser holds ~6), still caps connection-flood scrapers.
    limit_conn af_conn 40;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Retry-After $af_retry_after always;
    if ($af_bad_bot) { return 403; }

    # Paths probed by vulnerability scanners that this site will never serve:
    # answer fast and keep the access log clean.
    location ~* ^/(\.env|\.git|\.aws|\.ssh|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma) {
        return 404;
    }
    location ~* \.(sql|bak|old|orig|save|swp|dist|yml|yaml|toml|sh)$ {
        return 404;
    }

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/geo+json image/svg+xml;

    # --- Static files ---
    # ^~ keeps nginx from preferring a regex location, whatever the order in
    # this file: without it the extension 404 block above matches first and any
    # asset ending in .yml/.sh/.dist/… returns 404 before the alias is reached.
    # Those extensions deter scanner probes at the site root; they are not
    # access control over this directory.
    # No add_header and no expires here: either cancels inheritance of the
    # security headers, so the cache policy comes from $af_cache_control.
    location ^~ /static/ {
        alias /home/activefires/apps/Active_Fires/static_production/;
        access_log off;
    }

    # The uwsgi_*_timeout values in the locations below are 600 to match
    # `harakiri = 600` in uwsgi.ini. The smaller of the two is the real limit,
    # so they change together; nginx waiting past the worker's own deadline only
    # lengthens the 502 that follows.

    # --- Admin login: strict throttle, a human logging in never notices it ---
    # regex with optional trailing slash so /admin/login and /admin/login/ share the same bucket
    location ~ ^/admin/login/?$ {
        limit_req zone=af_login burst=5 nodelay;

        include uwsgi_params;
        uwsgi_pass django;
        uwsgi_ignore_client_abort on;
        uwsgi_read_timeout    600;
        uwsgi_send_timeout    600;
        uwsgi_connect_timeout 600;
    }

    # --- Expensive queries (full-country ranges stream megabytes) ---
    location ~ ^/active_fires\.json/?$ {
        limit_req zone=af_heavy burst=20 nodelay;

        # "Today" is imported hourly at :20, :25, :30 and :35
        # (page/data/active_fires/crontab.crt) and FIRMS trails the overpass by
        # hours, so 60 s of shared cache sits inside a window where the answer
        # cannot change. What absorbs a group arriving together is cache_lock,
        # not the TTL: concurrent identical requests wait for one upstream query
        # instead of each running their own, which holds even at a much shorter
        # TTL. Worst case a body is 60 s old plus one refresh (use_stale
        # updating). `make clean-cache` drops everything now.
        uwsgi_cache            af_json;
        # The page sends from_date, to_date and region in that fixed order and
        # deliberately not `extent`, which this endpoint ignores and which would
        # give every viewport its own entry. See templates/home.html.
        uwsgi_cache_key        "$request_method|$uri|$args";
        uwsgi_cache_valid      200 60s;
        uwsgi_cache_lock       on;
        uwsgi_cache_lock_timeout 30s;
        uwsgi_cache_use_stale  updating;
        # @never_cache addresses the browser, not a 60 s shared cache in front of
        # uWSGI. Set-Cookie stays un-ignored: nginx refuses to cache a response
        # carrying one, so a user-specific answer would drop out by itself.
        uwsgi_ignore_headers   Cache-Control Expires;

        include uwsgi_params;
        uwsgi_pass django;
        uwsgi_ignore_client_abort on;
        uwsgi_read_timeout    600;
        uwsgi_send_timeout    600;
        uwsgi_connect_timeout 600;
    }

    location ~ ^/download-result/?$ {
        limit_req zone=af_heavy burst=20 nodelay;

        include uwsgi_params;
        uwsgi_pass django;
        uwsgi_ignore_client_abort on;
        uwsgi_read_timeout    600;
        uwsgi_send_timeout    600;
        uwsgi_connect_timeout 600;
    }

    # --- Marker popups: users click several points in quick succession ---
    location ~ ^/get_popup\.geojson/?$ {
        limit_req zone=af_popup burst=20 nodelay;

        include uwsgi_params;
        uwsgi_pass django;
    }

    # --- Everything else ---
    location / {
        limit_req zone=af_general burst=20 nodelay;

        include uwsgi_params;
        uwsgi_pass django;

        uwsgi_ignore_client_abort on;
        uwsgi_read_timeout    600;
        uwsgi_send_timeout    600;
        uwsgi_connect_timeout 600;
    }
}
